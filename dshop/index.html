<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F5C4D">
<title>D Shop — Dr Han Health Care</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D Shop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--brand:#0F5C4D;--brand-2:#1B6E5E;--brand-soft:#E3F1EC;--ink:#15201C;--ink-2:#3A4743;--muted:#56635E;--line:#E3E8E6;--line-2:#EEF2F0;--bg:#F5F7F6;--card:#fff;--warn-bg:#FFF4E5;--warn:#92400E;--warn-line:#F6D9A8;--accent:#C2410C;--blue-bg:#E4ECF7;--blue:#1E4C8A;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.display{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.3px}
.container{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
.top .container{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:#fff}
.logo b{font-family:'Space Grotesk',sans-serif;font-size:24px}
.logo small{font-size:11px;color:#CFE6DF}
.search{flex:1 1 260px;background:#fff;border-radius:12px;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:var(--ink);min-width:0}
.topnav{display:flex;gap:6px;align-items:center}
.topnav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 12px;border-radius:10px}
.topnav a.on{background:var(--brand-2)}
.topnav .reqbtn{background:#fff;color:var(--brand)}
.org{font-size:12px;color:#CFE6DF}
/* bottom nav (phone) */
.bottom{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .top .container{gap:10px}
  .search{order:3;flex-basis:100%}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
  .bottom a.on{color:var(--brand);font-weight:600}
  main#app{padding-bottom:96px!important}
}
.badge-dot{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main#app{padding:20px 16px 48px}
/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.av-ok{background:var(--brand-soft);color:var(--brand)}
.av-low{background:var(--warn-bg);color:var(--warn)}
.av-req{background:var(--line-2);color:var(--muted)}
.st-sent{background:var(--line-2);color:var(--ink-2)}
.st-quoted{background:var(--blue-bg);color:var(--blue)}
.st-confirmed,.st-dispatched{background:var(--brand-soft);color:var(--brand)}
.st-billed{background:#EDE9FE;color:#5B21B6}
.st-callback{background:var(--warn-bg);color:var(--warn)}
.st-overdue{background:var(--warn-bg);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{border-color:#D5DCD9;color:var(--ink)}
.btn.sm{height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8CC7B8;outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{height:44px;border:1px solid #D5DCD9;border-radius:10px;padding:0 12px;font-size:15px;font-weight:400;color:var(--ink);background:#fff;min-width:0;width:100%}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#E9EEEC;border-radius:12px;padding:4px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.qty{display:inline-flex;align-items:center;border:1px solid #D5DCD9;border-radius:10px;height:40px}
.qty button{width:38px;height:38px;border:0;background:transparent;font-size:18px;color:var(--brand);cursor:pointer}
.qty span{min-width:24px;text-align:center;font-weight:600}
.chip{height:44px;min-width:64px;padding:0 12px;border-radius:10px;border:1px solid #D5DCD9;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border:2px solid var(--brand);background:var(--brand-soft);font-weight:600}
.thumb{border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif}
.list > *{border-bottom:1px solid var(--line-2)}
.list > *:last-child{border-bottom:0}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:44px;border:0;background:transparent;font-weight:600;color:var(--muted);padding:0;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.side{flex:1 1 230px;max-width:280px}
.content{flex:999 1 520px;min-width:0}
@media (max-width:760px){.side{max-width:none}}
.kpi b{font-family:'Space Grotesk',sans-serif;font-size:26px;display:block;line-height:1.1}
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:12px;min-height:48px}
.tl .dotcol{display:flex;flex-direction:column;align-items:center;width:18px}
.tl .dot{width:16px;height:16px;border-radius:8px;border:2px solid #D5DCD9;background:#fff;flex-shrink:0}
.tl .dot.done{background:var(--brand);border-color:var(--brand)}
.tl .dot.now{border-color:var(--accent)}
.tl .ln{flex:1;width:2px;background:#D5DCD9}
.tl .ln.done{background:var(--brand)}
.banner{background:var(--brand);color:#fff;border-radius:var(--r);padding:16px}
.banner .sub{color:#CFE6DF;font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.demo{background:#FFFBEB;border:1px dashed #E7C55A;border-radius:12px;padding:12px 14px;font-size:13px;color:#6B4E07}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:761px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
@media (min-width:761px){.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
@media (min-width:761px){.toast{bottom:32px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.docpaper{border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px}
.docpaper table{width:100%;border-collapse:collapse;margin-top:10px}
.docpaper th,.docpaper td{border-bottom:1px solid var(--line-2);padding:6px 4px;text-align:left}
.adm{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.adm th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.adm td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.adm tr:last-child td{border-bottom:0}

a{text-decoration:none}
.row.wrap{flex-wrap:wrap}
.err{color:var(--accent);min-height:1em}
.strong{font-weight:600}
.good{color:var(--brand)}
.warnc{color:var(--warn)}
.bluec{color:var(--blue)}
.ink{color:var(--ink)}.ink2{color:var(--ink-2)}
.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
h2{font-size:18px}
.tname{font-size:14px;display:block;line-height:1.25}
.pname{font-weight:600;color:var(--ink);line-height:1.3}
a.card{color:inherit}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi.warn{background:var(--warn-bg);border-color:var(--warn-line)}.kpi.warn b,.kpi.warn span{color:var(--warn)}
.types{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.two{grid-template-columns:1fr 1fr;gap:10px}
select{height:44px;border:1px solid #D5DCD9;border-radius:10px;padding:0 10px;background:#fff;font-size:15px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.total{border-top:1px solid var(--line);padding-top:8px}.total b{font-size:17px}.total .display{font-size:22px}
.chip.av-req{color:var(--muted);border-style:dashed}
.chip.av-low{border-color:var(--warn-line)}
.docpaper table{font-size:13px;min-width:680px;width:100%;border-collapse:collapse}.docpaper td,.docpaper th{vertical-align:top}.docpaper .num,.num{text-align:right;white-space:nowrap}
@media print{.top,.bottom,.noprint,#toast-root{display:none!important}main#app{padding:0!important}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<header class="top">
  <div class="container">
    <a class="logo" href="#home"><b>D Shop</b><small>by Dr Han Health Care</small></a>
    <label class="search" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search products</span><input id="q" type="search" placeholder="Search products by name or code" autocomplete="off"></label>
    <nav class="topnav" aria-label="Main" id="topnav"></nav>
  </div>
</header>
<main id="app" class="container" tabindex="-1"><div class="empty">Loading…</div></main>
<nav class="bottom" aria-label="Main (phone)" id="bottomnav" style="display:none"></nav>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js?v=2"></script>
<script src="app.js?v=1"></script>
</body>
</html>
